[project]
name = "mackeep-cli"
version = "0.27.0"
description = "Backup and keep your application settings in sync."
readme = "README.md"
requires-python = ">= 3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Laurent Raufaste", email = "analogue@glop.org" }]
maintainers = [{ name = "Joynik" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: Utilities",
]
dependencies = ["docopt-ng>=0.9.0"]

[project.urls]
Changelog = "https://github.com/Joynik/mackeep/releases"
Issues = "https://github.com/Joynik/mackeep/issues"
Repository = "https://github.com/Joynik/mackeep.git"

[project.scripts]
# The alias, kept until the desktop version takes the name
mackeep = "mackeep_cli.main:main"
mackeep-cli = "mackeep_cli.main:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.17.3",
  "deptry>=0.25.1",
  "pre-commit-hooks>=6.0.0",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.5",
  "rumdl>=0.3.5",
  "ty>=0.0.107",
  "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.deptry]
ignore_notebooks = true
known_first_party = ["mackeep", "mackeep_cli", "Translations"]

[tool.hatch.build.targets.wheel]
packages = ["src/mackeep", "src/mackeep_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "doc", "README.md", "LICENSE", "Makefile"]

[tool.vulture]
min_confidence = 80
exclude = [".venv/*", "*/.venv/*", "venv/*", "*/venv/*", "build/*", "dist/*"]
