version: 2
updates:
  # The actions of the workflows, they are pinned to a commit, Dependabot
  # updates the commit and the comment with the version.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # The dependencies of the project, they are locked in uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
