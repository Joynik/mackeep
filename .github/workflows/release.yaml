name: release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  # The release can also be started by hand, e.g. when the tag was pushed
  # with the other tags and GitHub did not create the event.
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            suffix: macos-arm64
          - os: ubuntu-24.04
            suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"

      - name: Check the version of the tag
        run: |
          set -euo pipefail
          VERSION="$(uv version --short)"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "The tag $TAG does not match the version $VERSION of the project"
            exit 1
          fi
          echo "The tag $TAG matches the version of the project"

      - name: Build the binary
        run: |
          uv build --wheel
          uv venv .build-venv
          uv pip install --python .build-venv/bin/python dist/*.whl nuitka
          .build-venv/bin/python -m nuitka --standalone \
            --output-filename=mackeep-cli \
            --include-package=mackeep \
            --include-package-data=mackeep \
            --include-distribution-metadata=mackeep-cli \
            --assume-yes-for-downloads \
            --output-dir=dist-bin \
            src/mackeep_cli/__main__.py
          rm -rf dist-bin/mackeep-cli
          mv dist-bin/__main__.dist dist-bin/mackeep-cli

      - name: Sign the binary
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - dist-bin/mackeep-cli/mackeep-cli
          codesign --verify --verbose dist-bin/mackeep-cli/mackeep-cli

      - name: Package the binary
        run: |
          mkdir -p dist
          tar -czf "dist/mackeep-cli-$(uv version --short)-${{ matrix.suffix }}.tar.gz" \
            -C dist-bin mackeep-cli
          if [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p dist-check
            tar -xzf "dist/mackeep-cli-$(uv version --short)-${{ matrix.suffix }}.tar.gz" \
              -C dist-check
            codesign --verify --verbose dist-check/mackeep-cli/mackeep-cli
            codesign -dv --verbose=2 dist-check/mackeep-cli/mackeep-cli
          fi

      - name: Smoke test the archive
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          ARCHIVE="dist/mackeep-cli-$(uv version --short)-${{ matrix.suffix }}.tar.gz"
          HOME_DIR="$WORK_DIR/home"
          XDG_DIR="$HOME_DIR/.config"
          mkdir -p "$WORK_DIR/app" "$HOME_DIR/storage/Mackeep" "$XDG_DIR"
          tar -xzf "$ARCHIVE" -C "$WORK_DIR/app"
          BIN="$WORK_DIR/app/mackeep-cli/mackeep-cli"
          chmod +x "$BIN"
          printf '[storage]\nengine = file_system\npath = %s\ndirectory = Mackeep\n' \
            "$HOME_DIR/storage" > "$HOME_DIR/.mackeep.cfg"

          echo "--- the version ---"
          HOME="$HOME_DIR" XDG_CONFIG_HOME="$XDG_DIR" "$BIN" --version

          echo "--- the list of the applications ---"
          HOME="$HOME_DIR" XDG_CONFIG_HOME="$XDG_DIR" \
            "$BIN" --json list > "$WORK_DIR/list.json"
          COUNT="$(jq 'length' "$WORK_DIR/list.json")"
          echo "applications in the binary: $COUNT"
          if [ "$COUNT" -lt 500 ]; then
            echo "Too few applications in the binary: $COUNT, expected more than 500"
            exit 1
          fi

          echo "--- the backup ---"
          HOME="$HOME_DIR" XDG_CONFIG_HOME="$XDG_DIR" "$BIN" backup --json

      - uses: actions/upload-artifact@v7
        with:
          name: mackeep-cli-${{ matrix.suffix }}
          path: dist/*.tar.gz

  desktop:
    # The image with the newest Xcode is used: an application built with an
    # old SDK keeps the old design of macOS, even on a new system. The image
    # is a preview, so the build can be slow.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"

      - name: Check the version of the tag
        run: |
          set -euo pipefail
          VERSION="$(uv version --short)"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "The tag $TAG does not match the version $VERSION of the project"
            exit 1
          fi
          echo "The tag $TAG matches the version $VERSION of the project"

      - name: Check the version of the application
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\(.*\)".*/\1/p' \
            desktop/project.yml)"
          VERSION="$(uv version --short)"
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "The version of the application $APP_VERSION does not match the version $VERSION of the project"
            exit 1
          fi
          echo "The version of the application is $APP_VERSION"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and package the application
        working-directory: desktop
        env:
          # There is no certificate of the developer on the runner, so the
          # application is signed ad-hoc
          XCODEBUILD_FLAGS: "CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="
        run: make package

      - name: Check the disk image
        run: |
          set -euo pipefail
          VERSION="$(uv version --short)"
          IMAGE="dist/Mackeep-$VERSION-macos-arm64.dmg"
          hdiutil verify "$IMAGE"
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "$IMAGE" -mountpoint "$MOUNT_DIR" -nobrowse
          codesign --verify --verbose "$MOUNT_DIR/Mackeep.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$MOUNT_DIR/Mackeep.app/Contents/Info.plist"
          hdiutil detach "$MOUNT_DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: mackeep-desktop-macos-arm64
          path: dist/*.dmg

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body: |
            The archives of the tool are the command line version, the disk
            image is the desktop application for macOS.
          files: |
            dist/**/mackeep-cli-*.tar.gz
            dist/**/Mackeep-*.dmg
