name: release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  # The release can also be started by hand, e.g. when the tag was pushed
  # with the other tags and GitHub did not create the event.
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            suffix: macos-arm64
          - os: ubuntu-24.04
            suffix: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"

      - name: Check the version of the tag
        run: |
          set -euo pipefail
          VERSION="$(uv version --short)"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "The tag $TAG does not match the version $VERSION of the project"
            exit 1
          fi
          echo "The tag $TAG matches the version of the project"

      - name: Build the binary
        run: |
          uv build --wheel
          uv venv .build-venv
          uv pip install --python .build-venv/bin/python dist/*.whl nuitka
          .build-venv/bin/python -m nuitka --standalone --onefile \
            --output-filename=mackeep-cli \
            --include-package=mackeep \
            --include-package-data=mackeep \
            --include-distribution-metadata=mackeep-cli \
            --assume-yes-for-downloads \
            --output-dir=dist-bin \
            src/mackeep_cli/__main__.py

      - name: Sign the binary
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - dist-bin/mackeep-cli
          codesign --verify --verbose dist-bin/mackeep-cli

      - name: Package the binary
        run: |
          mkdir -p dist
          tar -czf "dist/mackeep-cli-$(uv version --short)-${{ matrix.suffix }}.tar.gz" \
            -C dist-bin mackeep-cli
          if [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p dist-check
            tar -xzf "dist/mackeep-cli-$(uv version --short)-${{ matrix.suffix }}.tar.gz" \
              -C dist-check
            codesign --verify --verbose dist-check/mackeep-cli
            codesign -dv --verbose=2 dist-check/mackeep-cli
          fi

      - name: Smoke test the archive
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          ARCHIVE="dist/mackeep-cli-$(uv version --short)-${{ matrix.suffix }}.tar.gz"
          HOME_DIR="$WORK_DIR/home"
          mkdir -p "$WORK_DIR/app" "$HOME_DIR/storage/Mackeep"
          tar -xzf "$ARCHIVE" -C "$WORK_DIR/app"
          BIN="$WORK_DIR/app/mackeep-cli"
          chmod +x "$BIN"
          printf '[storage]\nengine = file_system\npath = %s\ndirectory = Mackeep\n' \
            "$HOME_DIR/storage" > "$HOME_DIR/.mackeep.cfg"

          echo "--- the version ---"
          HOME="$HOME_DIR" "$BIN" --version

          echo "--- the list of the applications ---"
          HOME="$HOME_DIR" "$BIN" --json list > "$WORK_DIR/list.json"
          COUNT="$(jq 'length' "$WORK_DIR/list.json")"
          echo "applications in the binary: $COUNT"
          if [ "$COUNT" -lt 500 ]; then
            echo "Too few applications in the binary: $COUNT, expected more than 500"
            exit 1
          fi

          echo "--- the backup ---"
          HOME="$HOME_DIR" "$BIN" backup --json

      - uses: actions/upload-artifact@v7
        with:
          name: mackeep-cli-${{ matrix.suffix }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: dist/**/mackeep-cli-*.tar.gz
