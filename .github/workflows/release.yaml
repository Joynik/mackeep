name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write  # create the GitHub release

jobs:

  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Build the package
        run: |
          uv build
          version=$(uv version --short)
          # One package per supported platform
          mv "dist/mackeep_cli-$version.tar.gz" "dist/mackeep-cli-$version-macos-arm64.tar.gz"
          cp "dist/mackeep-cli-$version-macos-arm64.tar.gz" "dist/mackeep-cli-$version-linux-x86_64.tar.gz"
          rm -f dist/.gitignore
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/mackeep-cli-*.tar.gz
