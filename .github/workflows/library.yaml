name: Publish library index

on:
  push:
    branches: [master]
    paths:
      - src/mackeep/applications/**
      - src/mackeep/library.py
      - src/mackeep/jsonapi.py
      - tools/generate_library_manifest.py
      - tests/test_catalog.py
      - tests/test_library_manifest.py
      - .github/workflows/library.yaml
  pull_request:
    paths:
      - src/mackeep/applications/**
      - src/mackeep/library.py
      - src/mackeep/jsonapi.py
      - tools/generate_library_manifest.py
      - tests/test_catalog.py
      - tests/test_library_manifest.py
      - .github/workflows/library.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --locked --dev
      - name: Validate application definitions and publisher
        run: uv run --no-sync python -m pytest tests/test_catalog.py tests/test_library_manifest.py
      - run: uv run --no-sync python tools/generate_library_manifest.py --revision "$GITHUB_SHA"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --locked --dev
      - name: Generate and publish the current library index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout --detach origin/master
            uv run --no-sync python -m pytest tests/test_catalog.py tests/test_library_manifest.py
            uv run --no-sync python tools/generate_library_manifest.py --revision "$(git rev-parse HEAD)"
            git add library-manifest.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Update library index"
            if git push origin HEAD:master; then
              exit 0
            fi
          done
          echo "Library index could not be published after concurrent pushes" >&2
          exit 1
