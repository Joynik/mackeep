name: ruff
on:
  push:
    branches:
      - master
  pull_request:

jobs:

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
