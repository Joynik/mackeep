name: install
on:
  push:
    branches:
      - master
  pull_request:

jobs:

  install-on-linux:
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
        python-version:
          - "3.14"
    runs-on: ${{ matrix.os }}
    container: python:${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - run: pip install .
      - run: mackeep-cli --help

  install-on-macos:
    strategy:
      matrix:
        os:
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: pip install .
      - run: mackeep-cli --help
