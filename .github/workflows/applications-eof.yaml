name: Application file endings

on:
  push:
    branches: [master]
    paths:
      - "src/mackeep/applications/**/*.cfg"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/applications-eof.yaml"
  pull_request:
    paths:
      - "src/mackeep/applications/**/*.cfg"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/applications-eof.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  applications-eof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --locked --dev
      - name: Check application file endings
        run: |
          find src/mackeep/applications -type f -name '*.cfg' \
            -exec uv run --no-sync --offline end-of-file-fixer {} +
