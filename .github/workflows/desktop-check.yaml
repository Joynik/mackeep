name: desktop check

# A temporary workflow to compare the design of the application built with
# the different versions of Xcode. It is not a part of the release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    strategy:
      matrix:
        include:
          - name: default
            dir: ""
          - name: xcode271
            dir: "/Applications/Xcode_27.1.app"
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the application
        working-directory: desktop
        env:
          XCODEBUILD_FLAGS: "CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="
        run: |
          if [ -n "${{ matrix.dir }}" ]; then export DEVELOPER_DIR="${{ matrix.dir }}"; fi
          make release

      - name: Package the application
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            desktop/build/Build/Products/Release/Mackeep.app \
            "dist/Mackeep-${{ matrix.name }}.zip"

      - name: The version of Xcode
        run: |
          ls /Applications | grep -i xcode
          xcodebuild -version
          plutil -p desktop/build/Build/Products/Release/Mackeep.app/Contents/Info.plist \
            | grep -E "DTXcode|DTSDKName"

      - uses: actions/upload-artifact@v7
        with:
          name: mackeep-${{ matrix.name }}
          path: dist/*.zip
