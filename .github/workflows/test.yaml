name: test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:

  pytest:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-26.04
          - macos-15
        python-version:
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --dev
      - run: uv run --no-sync python -m pytest --cov=mackeep --cov=mackeep_cli --cov-report=term

  desktop-unit:
    timeout-minutes: 20
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --dev
      - run: brew install xcodegen
      - run: xcodegen generate --spec desktop/project.yml
      - name: Run Swift unit and real-CLI integration tests
        run: |
          xcodebuild -project desktop/MackeepDesktop.xcodeproj -scheme MackeepDesktop \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath logs/desktop-tests \
            MACKEEP_BUNDLE_IDENTIFIER=com.joynik.mackeep.testing CODE_SIGNING_ALLOWED=NO \
            -only-testing:MackeepDesktopTests test
