# Sample Mackeep configuration. Choose storage before backup or restore.
# See README.md in this directory for all options.
[storage]
engine = unconfigured
directory = Mackeep

# To use an existing local or cloud-synced folder, replace engine above with
# file_system and add path, absolute or relative to HOME. Do not quote spaces.
# path = /absolute/path/to/storage
# Other engines: dropbox, google_drive, icloud.

# Identifiers from `mackeep-cli list`, one per line.
# An empty section selects none; removing the section selects all supported apps.
[applications_to_sync]
git
vim

# Ignored identifiers are removed from the selection. A named CLI operation
# overrides both lists for that command.
[applications_to_ignore]

[security]
allow_external_paths = false

# Global HOME-relative exclusions. XDG-relative rules belong in [xdg_exclude].
[exclude]
**/.DS_Store
