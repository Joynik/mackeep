name: mackeep
base: core24
adopt-info: mackeep
title: Mackeep
summary: Keep your application settings in sync
description: |
  Back ups your application settings in a safe directory (e.g. Dropbox).
  Syncs your application settings among all your workstations.
  Restores your configuration on any fresh install in one command line.

license: GPL-3.0-or-later
contact: https://github.com/Joynik/mackeep/issues
website: https://github.com/Joynik/mackeep
source-code: https://github.com/Joynik/mackeep
issues: https://github.com/Joynik/mackeep/issues

grade: stable
confinement: classic

apps:
  mackeep:
    command: bin/mackeep

parts:
  mackeep:
    plugin: python
    source: .
    stage-packages:
      - python3.14-minimal
      - libpython3.14-minimal
      - libpython3.14-stdlib
    override-pull: |
      craftctl default
      VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
      craftctl set version="$VERSION"
